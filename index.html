<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#123b2c">
    <meta name="description" content="Meva Mix — har kuni yangi mevalar, shirinliklar va ichimliklar. Buyurtma bering!">
    <title>Meva Mix 🍓 — Tabiatning eng mazali tomoni</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #123b2c;
            --green2: #1c5b40;
            --lime: #d9f36a;
            --cream: #f7f6ef;
            --ink: #17231d;
            --muted: #737d75;
            --line: #e5e8df;
            --white: #fff;
            --orange: #ff8758;
        }
        * {
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            margin: 0;
            background: var(--cream);
            color: var(--ink);
            font-family: "DM Sans", sans-serif;
        }
        button, input, textarea, select {
            font: inherit;
        }
        button {
            cursor: pointer;
        }
        .wrap {
            width: min(1180px, calc(100% - 40px));
            margin: auto;
        }
        header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(247, 246, 239, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(18, 59, 44, 0.08);
        }
        .nav {
            height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 22px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--green);
            font-weight: 800;
            font-size: 23px;
            letter-spacing: -1px;
        }
        .brand span {
            color: #7b9d3a;
        }
        .navlinks {
            display: flex;
            gap: 28px;
        }
        .navlinks a {
            color: #4d5b52;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .navlinks a:hover {
            color: var(--green2);
        }
        .cart-btn {
            border: 0;
            background: var(--green);
            color: white;
            border-radius: 999px;
            padding: 12px 17px;
            font-weight: 700;
            display: flex;
            gap: 9px;
            align-items: center;
        }
        @media (max-width: 680px) {
            .navlinks {
                display: none;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="wrap nav">
        <a class="brand" href="#bosh">
            Meva <span>Mix</span> 🍓
        </a>
        <nav class="navlinks">
            <a href="#bosh">Bosh sahifa</a>
            <a href="#mevalar">Mevalar</a>
            <a href="#biz-haqimizda">Biz haqimizda</a>
            <a href="#promo">Promokod</a>
        </nav>
        <button class="cart-btn" onclick="toggleCart()">
            🛒 Savatcha
        </button>
    </div>
</header>

</body>
</html>
